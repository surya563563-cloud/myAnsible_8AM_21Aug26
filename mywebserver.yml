---
- hosts: all
  become: yes
  gather_facts: yes
  tasks:
  - name: i want to install apache2 webser on debian nodes(apt-get install apache2)
    apt:
      name: apache2
      state: present
    when: ansibe_os_family == "Debian"    
  - name: i want to start apache2 webserr on debian nodes(service apache2 start)
    service:  
      name: apache2
      state: started
  - name:   ansibe_os_family == "Debian""   